services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    environment:
      APP_ENV: development
    ports:
      - "8080:8080"

  frontend:
    build:
      target: development-dependencies-env
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    ports: !override
      - "3000:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
