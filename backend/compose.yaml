services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=fiks
      - POSTGRES_USER=fiks
      - POSTGRES_PASSWORD=local_dev_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiks -d fiks']
      interval: 10s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
